<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سهل | طلب قطع الغيار</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#17233b;font-family:Tahoma,Arial,sans-serif}header{background:#122a50;color:white;padding:22px;text-align:center}header h1{margin:0;font-size:32px}main{max-width:750px;margin:24px auto;padding:0 15px}.card{background:white;border-radius:14px;padding:22px;margin-bottom:16px;box-shadow:0 2px 12px #17233b12}h2{margin-top:0;font-size:20px}label{display:block;font-weight:bold;margin:13px 0 6px}input,select,textarea{width:100%;padding:12px;border:1px solid #cbd3df;border-radius:8px;font:inherit}textarea{min-height:90px}button,.btn{display:inline-block;border:0;background:#147d68;color:white;padding:12px 20px;border-radius:9px;font:inherit;cursor:pointer;text-decoration:none;margin-top:14px}button.secondary{background:#264b79}button:disabled{opacity:.6}small{color:#566477}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:180px}.request{border:1px solid #dfe5ed;border-radius:10px;padding:14px;margin:12px 0;overflow-wrap:anywhere}.tag{color:#08735e;font-weight:bold}nav{display:flex;gap:8px;justify-content:center;margin-top:12px}nav button{margin:0}#notice{color:#11664c;font-weight:bold}footer{text-align:center;color:#647084;padding:20px}</style></head><body>
<header><h1>سهل | SAHL</h1><div>اطلب قطعة سيارتك بسهولة</div><nav><button onclick="show('customer')">طلب قطعة</button><button class="secondary" onclick="show('supplier')">المورد</button><button class="secondary" onclick="show('offers')">طلباتي</button></nav></header>
<main><section class="card" id="auth"><h2>حساب سهل</h2><label>الاسم</label><input id="name" placeholder="اسمك"><label>البريد الإلكتروني</label><input id="email" type="email"><label>كلمة المرور</label><input id="password" type="password" minlength="6"><label>نوع الحساب عند التسجيل</label><select id="role"><option value="customer">زبون</option><option value="supplier">مورد</option></select><div class="row"><button onclick="signUp()">إنشاء حساب</button><button class="secondary" onclick="signIn()">تسجيل دخول</button></div><p id="authmsg" role="status"></p></section><section class="card" id="account" hidden><span id="who"></span><button class="secondary" onclick="signOut()">خروج</button></section><section id="customer" class="card" hidden><h2>طلب سعر قطعة غيار</h2><form id="orderForm"><label>رقم الشاصي VIN (اختياري)</label><input name="vin" maxlength="17" placeholder="17 خانة"><label>رقم القطعة أو اسمها *</label><input name="part" required><label>نوع القطعة</label><select name="kind"><option value="OEM">أصلي</option><option value="aftermarket">تجاري</option><option value="used">مستعمل</option><option value="any">أي نوع</option></select><label>ملاحظات</label><textarea name="notes"></textarea><button>إرسال الطلب</button></form><p id="notice"></p></section><section id="supplier" class="card" hidden><h2>طلبات الزبائن</h2><button onclick="loadRequests()">تحديث الطلبات</button><div id="requests"></div></section><section id="offers" class="card" hidden><h2>طلباتي وعروض الأسعار</h2><button onclick="loadOffers()">تحديث</button><div id="offersList"></div></section></main><footer>SAHL — نسخة ربط تجريبية، لا يوجد دفع إلكتروني أو قبول عروض بعد</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const URL='https://gucrvdjqpkrjkrflqtfx.supabase.co';
const KEY='sb_publishable_RGPxnMguMr3eoT0qB63mtw_UZny9ZmU';
const db=window.supabase?.createClient(URL,KEY) || null;
function connectionCheck(){if(!db){document.getElementById('authmsg').textContent='تعذر تحميل مكتبة الاتصال. افتح التطبيق من رابط HTTPS منشور على الإنترنت، وليس من ملف التنزيلات.';return false;}return true;}
let user=null,role=null;
const el=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msg(t){el('authmsg').textContent=t}
async function signUp(){if(!connectionCheck())return;msg('جاري إنشاء الحساب...');try{const email=el('email').value.trim(),password=el('password').value,name=el('name').value.trim(),r=el('role').value;if(!name||!email||password.length<6)return msg('أدخل الاسم والإيميل وكلمة مرور 6 أحرف على الأقل');const {data,error}=await db.auth.signUp({email,password,options:{data:{display_name:name,role:r}}});if(error)return msg(error.message);if(data.session){await ensureProfile();await refresh()}else msg('تم إنشاء الحساب. افتح بريدك واضغط رابط التأكيد ثم سجّل الدخول.')}catch(e){msg('تعذر الاتصال: '+e.message)}} 
async function signIn(){if(!connectionCheck())return;msg('جاري تسجيل الدخول...');try{const {error}=await db.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});if(error)return msg(error.message);await refresh()}catch(e){msg('تعذر الاتصال: '+e.message)}}
async function signOut(){await db.auth.signOut();user=null;role=null;await refresh()}
async function ensureProfile(){const {data:{user:u}}=await db.auth.getUser();if(!u)return;const {data}=await db.from('profiles').select('role').eq('id',u.id).maybeSingle();if(data)return;const r=u.user_metadata?.role,n=u.user_metadata?.display_name;if(['customer','supplier'].includes(r)&&n)await db.from('profiles').insert({id:u.id,role:r,display_name:n})}
async function refresh(){const {data:{user:u}}=await db.auth.getUser();user=u;role=null;el('auth').hidden=!!u;el('account').hidden=!u;if(u){await ensureProfile();const {data,error}=await db.from('profiles').select('role,display_name').eq('id',u.id).maybeSingle();if(error||!data){el('who').textContent='الحساب يحتاج إكمال الملف الشخصي؛ تواصل مع الإدارة.'}else{role=data.role;el('who').textContent=`${data.display_name} — ${role==='supplier'?'مورد':'زبون'}`}}show(role==='supplier'?'supplier':'customer')}
function show(id){el('customer').hidden=!user||role!=='customer'||id!=='customer';el('supplier').hidden=!user||role!=='supplier'||id!=='supplier';el('offers').hidden=!user||role!=='customer'||id!=='offers';if(id==='supplier'&&role==='supplier')loadRequests();if(id==='offers'&&role==='customer')loadOffers()}
el('orderForm').onsubmit=async e=>{e.preventDefault();if(role!=='customer')return;const f=new FormData(e.target),vin=String(f.get('vin')).trim().toUpperCase();if(vin&&!/^[A-HJ-NPR-Z0-9]{17}$/.test(vin))return el('notice').textContent='رقم الشاصي غير صحيح';const {error}=await db.from('part_requests').insert({customer_id:user.id,vin:vin||null,part_name:f.get('part'),kind:f.get('kind'),notes:f.get('notes')||''});el('notice').textContent=error?'خطأ: '+error.message:'تم إرسال الطلب إلى قاعدة البيانات';if(!error)e.target.reset()};
async function loadRequests(){const box=el('requests');box.textContent='جاري التحميل...';const {data,error}=await db.from('part_requests').select('id,vin,part_name,kind,notes,created_at').order('created_at',{ascending:false}).limit(100);if(error)return box.textContent=error.message;box.replaceChildren();if(!data.length)box.textContent='لا توجد طلبات';for(const r of data){const d=document.createElement('div');d.className='request';d.innerHTML=`<strong>${esc(r.part_name)}</strong><p>الشاصي: ${esc(r.vin||'-')} | النوع: ${esc(r.kind)}<br>${esc(r.notes)}</p><input type="number" min="0.001" step="0.001" placeholder="السعر"><select><option>OMR</option><option>AED</option><option>USD</option></select><button>تقديم عرض</button><small></small>`;d.querySelector('button').onclick=async()=>{const amount=Number(d.querySelector('input').value),currency=d.querySelector('select').value;if(amount<=0)return;const {error}=await db.from('quotes').insert({request_id:r.id,supplier_id:user.id,amount,currency});d.querySelector('small').textContent=error?error.message:'تم إرسال العرض'};box.append(d)}}
async function loadOffers(){const box=el('offersList');box.textContent='جاري التحميل...';const {data,error}=await db.from('part_requests').select('id,part_name,kind,created_at,quotes(amount,currency,status,created_at)').eq('customer_id',user.id).order('created_at',{ascending:false});if(error)return box.textContent=error.message;box.replaceChildren();if(!data.length)box.textContent='لا توجد طلبات';for(const r of data){const d=document.createElement('div');d.className='request';d.innerHTML=`<strong>${esc(r.part_name)}</strong><p>${r.quotes.length?r.quotes.map(q=>esc(q.amount)+' '+esc(q.currency)+' — '+esc(q.status)).join('<br>'):'بانتظار عروض الأسعار'}</p>`;box.append(d)}}
if(connectionCheck()){refresh().catch(e=>msg('تعذر الاتصال: '+e.message));}
</script></body></html>
